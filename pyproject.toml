[project]
name = "br-financial-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "langchain>=1.3.16",
    "langchain-core>=1.6.0",
    "langchain-postgres>=0.0.17",
    "pgvector>=0.3.6,<0.4",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4.0",
    "pytest-bdd>=8.1.0",
    "ruff>=0.16.4",
]
[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra"
asyncio_mode = "strict"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "ASYNC",
]


[project.scripts]
br-financial-ai = "br_financial_ai.cli:main"