services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: br-financial-ai-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-br_financial_ai}
      POSTGRES_USER: ${POSTGRES_USER:-br_financial_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-br_financial_ai}

    ports:
      - "${POSTGRES_PORT:-5438}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-br_financial_ai} -d ${POSTGRES_DB:-br_financial_ai}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: